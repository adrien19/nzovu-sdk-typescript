name: Pull Request

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  pr-success:
    name: PR Check Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validation
    if: always()
    steps:
      - name: Require all validation jobs to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Validation failed, was cancelled, or was skipped."
            exit 1
          fi
