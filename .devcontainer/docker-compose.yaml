services:
  postgres:
    image: postgres:17-alpine
    profiles: [live]
    environment:
      POSTGRES_USER: nzovu
      POSTGRES_PASSWORD: sdk-fixture
      POSTGRES_DB: nzovu
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nzovu -d nzovu"]
      interval: 5s
      timeout: 5s
      retries: 12
